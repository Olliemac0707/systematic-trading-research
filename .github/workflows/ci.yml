name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Tests and coverage
        run: python -m pytest --cov=trading_research --cov-report=term-missing --cov-fail-under=84

      - name: Ruff
        run: ruff check .

      - name: Mypy
        run: mypy src tests
