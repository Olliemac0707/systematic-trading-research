schema_version = "1.0"

[[split_evaluations]]
id = "sma-isolated"
dataset = "../data/sample_prices.csv"
symbol = "DEMO"
starting_cash = "10000"
commission_bps = "1"
slippage_bps = "5"
end_of_test = "hold"
benchmark = "none"

[split_evaluations.split]
development_start = "2025-01-01T00:00:00+00:00"
development_end = "2025-01-04T00:00:00+00:00"
holdout_start = "2025-01-05T00:00:00+00:00"
holdout_end = "2025-01-08T00:00:00+00:00"
